name: Generate Keystore

on:
  workflow_dispatch:
    inputs:
      password:
        description: 'Keystore password (至少 6 位)'
        required: true
        default: 'changeit123'
      alias:
        description: 'Key alias'
        required: true
        default: 'eden'

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore eden.jks \
            -alias "${{ github.event.inputs.alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.password }}" \
            -keypass "${{ github.event.inputs.password }}" \
            -dname "CN=Eden Save Tool, OU=Dev, O=Personal, L=City, S=State, C=CN"

      - name: Base64 encode keystore
        run: base64 -w 0 eden.jks > eden.jks.b64

      - name: Show base64 (复制到 Secret)
        run: |
          echo "==================== BASE64 BEGIN ===================="
          cat eden.jks.b64
          echo ""
          echo "====================  BASE64 END  ===================="

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: |
            eden.jks
            eden.jks.b64

      - name: 提醒
        run: |
          echo "⚠️ 下载完 artifact、复制完 base64 后，立即删除这个 workflow 文件和运行记录！"